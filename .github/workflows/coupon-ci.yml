name: coupon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coupon_test
        ports:
          # Matches docker-compose.yml so local and CI share one DATABASE_URL.
          - 13011:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coupon_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:13011/coupon_test?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/consumer/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm run prisma:generate

      - name: DB push
        run: pnpm run db:push

      - name: Typecheck
        run: pnpm run typecheck

      - name: Isolation check
        run: pnpm run check:isolation

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      - name: Concurrency x3
        run: pnpm run test:concurrency:x3

      # The consumer sample is the only asset that proves the package works
      # from OUTSIDE this repo: it owns its own schema, merges the published
      # prisma fragment into it, and redeems inside its own transaction.
      # It consumes dist/, so it must run after Build.
      - name: Consumer sample — install
        working-directory: examples/consumer
        run: pnpm install --frozen-lockfile

      - name: Consumer sample — prisma generate + db push
        working-directory: examples/consumer
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:13011/coupon_test?schema=consumer_sample"
        run: |
          pnpm run prisma:generate
          pnpm run db:push

      - name: Consumer sample — smoke test
        working-directory: examples/consumer
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:13011/coupon_test?schema=consumer_sample"
        run: pnpm run test

      - name: Pack (dry run)
        run: pnpm pack --pack-destination /tmp
