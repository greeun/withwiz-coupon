name: coupon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coupon_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coupon_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5442/coupon_test?schema=public"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packages/coupon/pnpm-lock.yaml

      - name: Install
        working-directory: packages/coupon
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: packages/coupon
        run: pnpm run prisma:generate

      - name: DB push
        working-directory: packages/coupon
        run: pnpm run db:push

      - name: Typecheck
        working-directory: packages/coupon
        run: pnpm run typecheck

      - name: Isolation check
        working-directory: packages/coupon
        run: pnpm run check:isolation

      - name: Build
        working-directory: packages/coupon
        run: pnpm run build

      - name: Test
        working-directory: packages/coupon
        run: pnpm run test:coverage

      - name: Concurrency x3
        working-directory: packages/coupon
        run: pnpm run test:concurrency:x3

      - name: Pack (dry run)
        working-directory: packages/coupon
        run: pnpm pack --pack-destination /tmp
