services:
  coupon-test-db:
    image: postgres:15-alpine
    container_name: withwiz-coupon-test-db
    environment:
      POSTGRES_DB: coupon_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5449:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coupon_test"]
      interval: 2s
      timeout: 5s
      retries: 20
