# Pins this sample as its own pnpm workspace root. The package repo above it
# is a workspace root too, so without this file pnpm would install the sample
# into that one instead of treating it as the standalone consumer it is meant
# to represent.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Mirrors the package root: prisma 6 still requests deepmerge-ts < 8, which
# has a known stack-exhaustion advisory. Dev-only; drop with prisma 7.
overrides:
  deepmerge-ts: '>=8.0.0'
